[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discrod"
version = "0.1.0"
description = "MIDI-triggered soundboard with a virtual microphone for Discord"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "PySide6>=6.6",
]

[project.scripts]
discrod = "discrod.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["discrod*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
